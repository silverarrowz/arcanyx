server {
    server_name arcanyx.ru www.arcanyx.ru;

    client_max_body_size 140m;
    ssl_buffer_size 4k;
    reset_timedout_connection on;

    location /media/ {
        alias /var/www/arcanyx/media/;
        sendfile on;
        tcp_nopush on;
        gzip off;
        default_type audio/mpeg;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Disposition inline;
    }

    location ~ ^/api/meditations/[^/]+/audio {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
        proxy_connect_timeout 10;
        proxy_send_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30;
        proxy_connect_timeout 5;
        proxy_send_timeout 30;
        proxy_buffering on;
        proxy_request_buffering off;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/arcanyx.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/arcanyx.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.arcanyx.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = arcanyx.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name arcanyx.ru www.arcanyx.ru;
    return 404; # managed by Certbot




}